<h2 mat-dialog-title>{{ isEdit ? 'Edit expense' : 'New expense' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="form">
    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <input matInput formControlName="description" placeholder="e.g. AWS hosting" required />
    </mat-form-field>

    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>Amount</mat-label>
        <input matInput formControlName="amount" type="number" min="0.01" step="0.01" required />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Currency</mat-label>
        <mat-select formControlName="currencyCode" required>
          @for (currency of currencies | async; track currency.code) {
            <mat-option [value]="currency.code">
              {{ currency.code }} — {{ currency.name }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Category</mat-label>
      <mat-select formControlName="categoryId">
        <mat-option [value]="null">None</mat-option>
        @for (category of categories; track category.id) {
          <mat-option [value]="category.id">
            <span class="category-option">
              <span class="dot" [style.background]="category.color || '#9e9e9e'"></span>
              {{ category.name }}
            </span>
          </mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Date</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="expenseDate" required />
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Notes</mat-label>
      <textarea matInput formControlName="notes" rows="2"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button color="primary" [disabled]="form.invalid" (click)="save()">
    {{ isEdit ? 'Save' : 'Create' }}
  </button>
</mat-dialog-actions>
